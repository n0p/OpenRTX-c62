#
# The kernel configuration the radio runs, for the parts that decide this
# question: assertions on and verbose, logging deferred with its own thread and
# the UART backend, printk routed through the log, POSIX pthreads over the
# kernel's mutexes, and C++ for the audio path table.
#
# Mirrors platform/mcu/CSK6011B/zephyr.conf (the C62's) and
# platform/targets/c62/c62_defconfig; anything that is about the CSK6 SoC itself
# is left out because this board does not have it.

CONFIG_ASSERT=y
CONFIG_ASSERT_LEVEL=2
CONFIG_ASSERT_VERBOSE=y

CONFIG_PRINTK=y
CONFIG_PRINTK_SYNC=y
CONFIG_LOG=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1280
# The radio leaves the default second; here the run is shorter than that.
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_POSIX_CLOCK=y
CONFIG_PTHREAD_IPC=y
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16
CONFIG_MAX_PTHREAD_COUNT=8

CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_STD_CPP14=y
CONFIG_NEWLIB_LIBC=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768

# QEMU's mps2-an521 model reports a different number of MPU regions than the
# board's Zephyr config expects, and the kernel asserts on the mismatch at
# boot.  The radio has no MPU-based isolation either (no userspace), and this
# harness is about the kernel's mutex rules, so the MPU is not needed.
CONFIG_ARM_MPU=n
CONFIG_MPU=n
